# The one CI gate (2026-10-09 code-quality audit, rank 34): every test suite in
# the repo, hermetic and offline, on every push and pull request to main.
#
#   python   pytest's default selection (pytest.ini) + the ToolVault validator
#            + ruff's event-loop blocking rules (Orchestrator/ruff.toml)
#   mcp      MCP/run_tests.sh in a venv built from MCP/requirements.txt
#   web      scripts/run_web_tests.sh (Portal + tests/web node suites)
#   shell    scripts/tests/run_all.sh (installer / sudoers perimeter suites)
#   android  :app:testDebugUnitTest
#
# No job needs a secret, and none may read one: the suites strip credential
# variables, block non-loopback network and never start the app's side-effect
# hooks (conftest.py). Third-party actions are pinned to full commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest + ToolVault validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
            requirements.dev.txt

      # tmux: the CLI-agent session-manager tests drive a real tmux server.
      # visudo (the sudo package) is already on the image for the shell suites
      # that test_install_helpers_shell.py runs.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          test -x /usr/sbin/visudo

      # The hashed lock is what the boxes install once it carries hashes;
      # until then the manifest. Dev tools (pytest, pytest-asyncio,
      # pytest-timeout) come from requirements.dev.txt either way.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if grep -q -- '--hash=' requirements.lock.txt 2>/dev/null; then
            python -m pip install --require-hashes -r requirements.lock.txt
          else
            python -m pip install -r requirements.txt
          fi
          python -m pip install -r requirements.dev.txt

      # config.py reads ./config.ini at import. A box gets it from install.sh;
      # the template is the fresh-box state the suite must pass on.
      - name: Fresh-box config
        run: cp config.ini.template config.ini

      - name: ToolVault modules validate
        run: python -m Orchestrator.toolvault.validate

      # Event-loop blocking gate (audit rank 46): only the flake8-async rules,
      # from Orchestrator/ruff.toml. A lint check; nothing is reformatted.
      - name: Ruff (event-loop blocking rules)
        run: python -m ruff check Orchestrator

      - name: pytest
        run: python -m pytest -p no:cacheprovider -rfEs

  mcp:
    name: MCP server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MCP/requirements.txt
            requirements.dev.txt

      # The server runs in its own lean venv on a box (MCP/README.md); the
      # suite gets the same: MCP/requirements.txt plus the test tools.
      - name: Lean MCP venv
        run: |
          python -m venv "$RUNNER_TEMP/mcp-venv"
          "$RUNNER_TEMP/mcp-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/mcp-venv/bin/python" -m pip install -r MCP/requirements.txt -r requirements.dev.txt

      - name: MCP/run_tests.sh
        run: bash MCP/run_tests.sh "$RUNNER_TEMP/mcp-venv/bin/python"

  web:
    name: Portal node suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: scripts/run_web_tests.sh
        run: bash scripts/run_web_tests.sh

  shell:
    name: Installer shell suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The sudoers perimeter suite runs `visudo -c` on the rendered template.
      - name: visudo
        run: |
          if [ ! -x /usr/sbin/visudo ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends sudo
          fi

      - name: scripts/tests/run_all.sh
        run: bash scripts/tests/run_all.sh

  android:
    name: Android unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "AI_BlackBox_Portal_Android_MVP (2)/AI_BlackBox_Portal_Android_MVP/AI_BlackBox_Portal"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # local.properties is gitignored (it names a machine's SDK). Point it at
      # the image's preinstalled SDK. The build needs no google-services.json,
      # and release signing is opt-in (BLACKBOX_KEYSTORE_*), so no secret.
      - name: Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: ":app:testDebugUnitTest"
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
