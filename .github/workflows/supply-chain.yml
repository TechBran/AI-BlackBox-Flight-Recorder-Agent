# Supply-chain gate for the Python venvs (audit rank 35: X01-deps-python-02,
# -05, -06). Separate from ci.yml so the test suite and this gate fail
# independently.
#
#   1. requirements.lock.txt and requirements.txt match requirements.in
#      (scripts/compile_python_lock.sh --check).
#   2. The Orchestrator venv builds from the lock with --require-hashes, and
#      every third-party import in Orchestrator/ and ToolVault/ is declared in
#      requirements.in and importable there (scripts/check_imports_vs_manifest.py).
#      The CPU reranker stack that installer/templates/blackbox-install-reranker-cpu.sh
#      adds on MID-tier boxes still resolves under the lock's pins.
#   3. pip-audit finds no known vulnerability in the lock or in the MCP venv's
#      manifest. The weekly run catches advisories published against an
#      unchanged lock.
#
# Actions are pinned to commit SHAs; the tools run from a hash-checked lock
# (.github/supply-chain-tools.lock.txt).
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python lock, imports and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install the pinned tools (hash-checked)
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --disable-pip-version-check \
            --require-hashes -r .github/supply-chain-tools.lock.txt

      - name: Lock files are in sync with requirements.in
        run: UV="$RUNNER_TEMP/tools/bin/uv" scripts/compile_python_lock.sh --check

      - name: Build the Orchestrator venv from the lock (hash-checked)
        run: |
          python -m venv "$RUNNER_TEMP/orch"
          "$RUNNER_TEMP/orch/bin/pip" install --disable-pip-version-check \
            --require-hashes -r requirements.lock.txt
          "$RUNNER_TEMP/orch/bin/pip" check

      - name: Imports match requirements.in
        run: '"$RUNNER_TEMP/orch/bin/python" scripts/check_imports_vs_manifest.py --require-installed'

      - name: The CPU reranker stack resolves under the lock's pins
        # The installer adds it with -c requirements.txt and the updater
        # reinstalls it the same way after a lock change, so a lock that leaves
        # no compatible transformers must fail here, not on a box. Resolution
        # only (wheel metadata); nothing is downloaded or installed.
        run: >-
          "$RUNNER_TEMP/orch/bin/pip" install --dry-run --quiet
          --disable-pip-version-check -c requirements.txt sentence-transformers

      - name: pip-audit requirements.lock.txt
        # Known exceptions, all Starlette 0.48: the fixes are in 0.49.1 and
        # 1.x, which need the fastapi upgrade (audit rank 70). Remove these
        # with that upgrade; never add one without a tracking reason here.
        run: >-
          "$RUNNER_TEMP/tools/bin/pip-audit" -r requirements.lock.txt
          --disable-pip --strict --progress-spinner off
          --ignore-vuln CVE-2025-62727
          --ignore-vuln CVE-2026-48710
          --ignore-vuln CVE-2026-48817
          --ignore-vuln CVE-2026-48818
          --ignore-vuln CVE-2026-54282
          --ignore-vuln CVE-2026-54283

      - name: pip-audit MCP/requirements.txt
        run: '"$RUNNER_TEMP/tools/bin/pip-audit" -r MCP/requirements.txt --strict --progress-spinner off'
