import com.aiblackbox.buildlogic.CheckMergedNativeLibAlignment
import com.aiblackbox.buildlogic.CheckNativeLibAlignment
import com.android.build.api.artifact.SingleArtifact
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Versions: gradle/libs.versions.toml. Kotlin is compiled by AGP 9's built-in Kotlin support,
// so no org.jetbrains.kotlin.android plugin is applied (audit X02-deps-android-web-04).
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

// Robolectric's framework jar (see testOptions below): one exact artifact, no transitives.
configurations {
    robolectricAndroidAll {
        canBeConsumed = false
        transitive = false
    }
}
def robolectricAndroidAllDir = layout.buildDirectory.dir('robolectric-android-all')
def robolectricAndroidAllJars = tasks.register('robolectricAndroidAllJars', Sync) {
    from configurations.robolectricAndroidAll
    into robolectricAndroidAllDir
}

android {
    namespace = 'com.aiblackbox.portal'
    // Compose 1.12 (compose-bom 2026.09.00) is built against API 37 and requires it. This is
    // the API surface the app compiles against only; runtime behaviour follows targetSdk.
    compileSdk = 37

    defaultConfig {
        applicationId = "com.aiblackbox.portal"
        minSdk = 26
        targetSdk = 36
        // Phase 4 + Phase 5 CLI Agent zellij rewrite + master-token model.
        // First public APK release. Bump versionCode on every future
        // change so customers' installed APKs upgrade over the top
        // without uninstalling.
        versionCode = 37
        // W10 mic A/B: `-PforceMicSource=VOICE_COMMUNICATION` builds a debug APK whose composer
        // mic is pinned to that source (MicSourcePolicy.simplexChain), named so it cannot be
        // mistaken for the shipping build. Empty, and pinned by MicSourcePolicyTest, otherwise.
        def forceMicSource = (project.findProperty('forceMicSource') ?: '').toString().trim()
        versionName = "1.13.1-m1-hardening" + (forceMicSource ? "-ab-mic-" + forceMicSource.toLowerCase() : "")
        buildConfigField "String", "FORCE_MIC_SOURCE", "\"${forceMicSource}\""
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // 64-bit ARM only: every phone, Fold and XR headset this app targets is arm64, and
        // LiteRT-LM ships no 32-bit build. Dropping armeabi-v7a/x86/x86_64 keeps 4 KB-aligned
        // 32-bit copies (and emulator-only libraries) out of the APK.
        ndk {
            abiFilters.add('arm64-v8a')
        }
        manifestPlaceholders["cleartext"] = "true"
    }

    // (M8.5) Enterprise/sideload signing. The keystore is sourced from Gradle properties OR
    // environment variables — NEVER a committed keystore (none is checked in). Provide, in
    // ~/.gradle/gradle.properties or the CI/MDM environment:
    //   BLACKBOX_KEYSTORE_FILE, BLACKBOX_KEYSTORE_PASSWORD, BLACKBOX_KEY_ALIAS, BLACKBOX_KEY_PASSWORD
    // See docs/DEVICE_CONTROL_DEPLOYMENT.md. This app is distributed by SIDELOAD / MDM only — it
    // is Play-ineligible (an assistant/automation a11y app, never android:isAccessibilityTool).
    signingConfigs {
        release {
            def ksPath = project.findProperty('BLACKBOX_KEYSTORE_FILE') ?: System.getenv('BLACKBOX_KEYSTORE_FILE')
            if (ksPath) {
                storeFile = file(ksPath)
                storePassword = project.findProperty('BLACKBOX_KEYSTORE_PASSWORD') ?: System.getenv('BLACKBOX_KEYSTORE_PASSWORD')
                keyAlias = project.findProperty('BLACKBOX_KEY_ALIAS') ?: System.getenv('BLACKBOX_KEY_ALIAS')
                keyPassword = project.findProperty('BLACKBOX_KEY_PASSWORD') ?: System.getenv('BLACKBOX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the enterprise keystore when configured; otherwise fall back to DEBUG signing so
            // the release build is still buildable/testable on a fresh box.
            def hasReleaseKeystore = (project.findProperty('BLACKBOX_KEYSTORE_FILE') ?: System.getenv('BLACKBOX_KEYSTORE_FILE')) != null
            // (M8.5) DISTRIBUTION HARD GATE. A distributable release MUST be enterprise-signed. Opt
            // in from the release/CI pipeline with `-PrequireReleaseSigning` (or the env var
            // BLACKBOX_REQUIRE_RELEASE_SIGNING): with the flag set and no BLACKBOX_KEYSTORE_*
            // configured, assembleRelease FAILS instead of silently producing a debug-signed APK.
            // Without the flag (the default) a fresh box still builds — it just falls back to debug
            // signing with a loud warning. So CI that ships an APK sets the flag; local/dev doesn't.
            // NB: use hasProperty (not findProperty ?: env) — a bare `-PrequireReleaseSigning` sets
            // the property to an EMPTY string, which Groovy's `?:` treats as falsy and would drop.
            def requireReleaseSigning = project.hasProperty('requireReleaseSigning') || System.getenv('BLACKBOX_REQUIRE_RELEASE_SIGNING') != null
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else if (requireReleaseSigning) {
                throw new GradleException('[BlackBox] assembleRelease requires enterprise signing: set BLACKBOX_KEYSTORE_FILE / BLACKBOX_KEYSTORE_PASSWORD / BLACKBOX_KEY_ALIAS / BLACKBOX_KEY_PASSWORD (a debug-signed APK must NEVER be distributed). See docs/DEVICE_CONTROL_DEPLOYMENT.md.')
            } else {
                // TODO(release): supply the enterprise keystore via BLACKBOX_KEYSTORE_* (env or
                // gradle props) before distributing. This DEBUG-signed fallback keeps the release
                // build green for CI/local; a debug-signed APK MUST NOT be shipped to customers.
                signingConfig = signingConfigs.debug
                logger.warn('[BlackBox] RELEASE APK is DEBUG-SIGNED (no BLACKBOX_KEYSTORE_FILE set). Do not distribute; pass -PrequireReleaseSigning in the release pipeline to make this a hard failure. See docs/DEVICE_CONTROL_DEPLOYMENT.md')
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        // android.util.Log (and other android.jar calls) return defaults instead of
        // throwing "not mocked" in plain JVM unit tests — lets Log-using classes
        // (e.g. RemoteTaskRunner's failure telemetry) be unit-tested. Only affects
        // calls that would otherwise throw, so currently-passing tests are unaffected.
        unitTests.returnDefaultValues = true

        // The *Diagnostic classes under src/test are MEASUREMENT PRINTERS (noise floors, range
        // budgets, candidate gates): they assert nothing and print reports for a human to read. They
        // stay OUT of the default unit-test gate, where they cost about a third of its run time and
        // printed "FAIL" verdicts into green builds. The invariants they leaned on are asserted by
        // real tests (TapEquivalenceTest, WaveformDynamicsGatesTest, NoiseGateSimulationTest). Opt in:
        //   ./gradlew :app:testDebugUnitTest --offline -PincludeDiagnostics --tests '*Diagnostic' -i
        unitTests.all { test ->
            if (!project.hasProperty('includeDiagnostics')) {
                test.filter { excludeTestsMatching '*Diagnostic' }
            }
            // Robolectric would otherwise download its android-all framework jar at test time
            // from Maven Central into ~/.m2, outside Gradle's cache, --offline and
            // gradle/verification-metadata.xml. Gradle resolves and verifies it instead
            // (the robolectricAndroidAll configuration above) and Robolectric runs offline
            // against that copy.
            test.inputs.files(robolectricAndroidAllJars)
                .withPropertyName('robolectricAndroidAll')
                .withPathSensitivity(PathSensitivity.NAME_ONLY)
            test.systemProperty 'robolectric.offline', 'true'
            test.systemProperty 'robolectric.dependency.dir', robolectricAndroidAllDir.get().asFile.absolutePath
        }
    }
}

// 16 KB page alignment (audit A01-activities-root-11). Android 15+ devices with 16 KB pages
// cannot dlopen a 64-bit library whose LOAD segments are 4 KB-aligned, nor map an uncompressed
// one that is not page-aligned inside the APK; Android 16 shows a page-size compat warning.
// Two checks per variant (buildSrc NativeLibAlignment, the checks AOSP's check_elf_alignment.sh
// and `zipalign -c -P 16` make):
//  - check<Variant>MergedNativeLibAlignment runs before package<Variant> on the merged libraries
//    of the ABIs the APK packages, so a 4 KB-aligned library fails the build before an APK is
//    written and nothing new is left on the output path to sideload.
//  - check<Variant>NativeLibAlignment runs after every package<Variant>, whichever task asked
//    for the APK, and also checks where each uncompressed library sits inside it. On a failure
//    there the APK is left in place (renaming it breaks AGP's incremental packaging), so do not
//    install from a failed build. assemble<Variant>, install<Variant> and
//    connected<Variant>AndroidTest wait for it, so none of them installs an unchecked APK.
// App bundles (bundle<Variant>) get only the first check: this app ships as an APK.
androidComponents {
    onVariants(selector().all()) { variant ->
        def variantName = variant.name.capitalize()
        def mergedLibsCheck = tasks.register("check${variantName}MergedNativeLibAlignment", CheckMergedNativeLibAlignment) {
            nativeLibsDirectory = variant.artifacts.get(SingleArtifact.MERGED_NATIVE_LIBS.INSTANCE)
            abis.addAll(android.defaultConfig.ndk.abiFilters)
            report = layout.buildDirectory.file("reports/native-lib-alignment/${variant.name}-merged.txt")
        }
        def alignmentCheck = tasks.register("check${variantName}NativeLibAlignment", CheckNativeLibAlignment) {
            apkDirectory = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
            report = layout.buildDirectory.file("reports/native-lib-alignment/${variant.name}.txt")
        }
        tasks.named { it == "package${variantName}" || it == "package${variantName}Bundle" }.configureEach {
            dependsOn mergedLibsCheck
        }
        tasks.named { it == "package${variantName}" }.configureEach {
            finalizedBy alignmentCheck
        }
        def gated = ["assemble${variantName}", "install${variantName}", "connected${variantName}AndroidTest"]
            .collect { it.toString() }
        tasks.named { it in gated }.configureEach {
            dependsOn alignmentCheck
        }
    }
}

// kotlinOptions {} is gone with the kotlin-android plugin. Built-in Kotlin would default the
// JVM target to compileOptions.targetCompatibility; it is pinned here so the two cannot drift.
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

