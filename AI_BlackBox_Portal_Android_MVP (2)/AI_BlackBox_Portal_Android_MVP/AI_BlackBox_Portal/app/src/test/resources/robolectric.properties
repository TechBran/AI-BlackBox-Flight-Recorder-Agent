# Robolectric runs @RunWith(RobolectricTestRunner::class) tests on this framework SDK. Its
# android-all jar is resolved and verified by Gradle (robolectric-android-all in
# gradle/libs.versions.toml) and Robolectric runs offline against it, so a test that asks for
# another SDK fails instead of downloading one. Change both together.
#
# 34, not the app's targetSdk 36: Robolectric needs Java 21 for SDK 35 and up, and the build
# and CI run on JDK 17 (AGP 9's minimum). Move to 36 together with a Java 21 test toolchain.
sdk=34
