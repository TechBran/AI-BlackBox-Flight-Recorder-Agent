# The one place a dependency or plugin version is written (audit X02-deps-android-web-17).
# Build scripts reference these as libs.<alias>; one [versions] ref per family.
#
# Toolchain coherence: Kotlin (the Compose compiler and serialization plugins with it), AGP and
# the Gradle wrapper (gradle/wrapper/gradle-wrapper.properties) must stay inside the Kotlin
# Gradle plugin's tested matrix, kotlinlang.org "Gradle and Android Gradle plugin
# compatibility". KGP 2.4.20-2.4.21 is tested on Gradle 7.6.3-9.7 and AGP 8.5.2-9.3.
# Move all three together.
#
# Every artifact the build resolves is pinned by sha256 in gradle/verification-metadata.xml
# (audit X02-deps-android-web-07), so a changed version fails the build until it is recorded.
# Regenerate from this project directory, rerunning tasks so every tool classpath resolves:
#   ./gradlew --continue --rerun-tasks --write-verification-metadata sha256 help \
#       :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest \
#       :app:assembleDebugAndroidTest :app:lintDebug
# Gradle merges into the existing file; delete it first to drop superseded versions, and then
# re-add the <trusted-artifacts> block and the aapt2 -osx/-windows jars, which a Linux run
# does not record. Review the diff before committing.
[versions]
agp = "9.3.3"
kotlin = "2.4.21"

androidx-activity = "1.11.0"
androidx-lifecycle = "2.9.0"
compose-bom = "2025.05.01"
coroutines = "1.10.2"
markdown-renderer = "0.28.0"
okhttp = "5.3.2"
serialization = "1.8.1"
termux = "v0.118.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.17.0" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.7" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.9.0" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.14.0" }
androidx-window = { module = "androidx.window:window", version = "1.3.0" }
google-material = { module = "com.google.android.material:material", version = "1.13.0" }

# Versions come from the BOM.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-mockwebserver3-junit4 = { module = "com.squareup.okhttp3:mockwebserver3-junit4" }

coil-compose = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
litertlm-android = { module = "com.google.ai.edge.litertlm:litertlm-android", version = "0.13.1" }
markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "markdown-renderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version = "2.3.1" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version = "4.3.0" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }

# Resolved from JitPack only (settings.gradle scopes that repository to this group).
termux-terminal-emulator = { module = "com.github.termux.termux-app:terminal-emulator", version.ref = "termux" }
termux-terminal-view = { module = "com.github.termux.termux-app:terminal-view", version.ref = "termux" }

junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself (built-in Kotlin), so there is no kotlin-android plugin. This
# plugin depends on the Kotlin Gradle plugin at its own version, which is what puts KGP
# ${kotlin} (not AGP's older default) on the build classpath.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
