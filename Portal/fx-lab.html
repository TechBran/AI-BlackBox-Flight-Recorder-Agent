<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>FX Lab — particle effect gallery</title>
<!--
  fx-lab.html — the M3 approval gallery.

  Every registered effect runs LIVE, at full quality, behind a real chat
  transcript, because the only question that matters for a backdrop is "can I
  still read the text over it". A grid of pretty thumbnails would answer the
  wrong question.

  This page does NOT use ember-fx.js. That engine is a singleton (one canvas,
  one selected field), so it cannot show ten effects at once. Instead the lab
  drives effect DESCRIPTORS directly — init/resize/update/draw plus the engine's
  own clearPolicy/blend helpers — which is exactly what the registry refactor
  made possible, and it doubles as proof the descriptor contract is complete.

  Not linked from the Portal: open it directly at /ui/fx-lab.html.
-->
<style>
  :root {
    --bg: #050505;
    --panel: rgba(22,22,24,.92);
    --line: rgba(255,255,255,.10);
    --text: #f2f2f2;
    --muted: #c9c9c9;
    --dim: #8a8a8a;
    --accent: #ff4a4a;
    --ok: #4ade80;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
    padding: 14px 20px; background: rgba(5,5,5,.94);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em; }
  h1 em { color: var(--accent); font-style: normal; }
  .meta { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--muted); font-weight: 500; }

  .grid {
    display: grid; gap: 18px; padding: 18px 20px 60px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  }
  .card {
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: #000; display: flex; flex-direction: column;
  }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .card-head .name { font-weight: 600; }
  .card-head .id { color: var(--dim); font-size: 11px; font-family: ui-monospace, monospace; }
  .badge {
    margin-left: auto; font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim);
  }
  .badge.additive { color: var(--warn); border-color: rgba(251,191,36,.35); }

  /* The stage: canvas UNDER a real transcript, exactly like the Portal (the
     canvas is z0, #history is raised and transparent). */
  .stage { position: relative; height: 300px; background: #000; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .transcript {
    position: relative; z-index: 1; height: 100%; overflow: hidden;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    justify-content: flex-end; pointer-events: none;
  }
  .msg { max-width: 88%; font-size: 13px; line-height: 1.45; }
  .msg.user { align-self: flex-end; color: var(--text); background: rgba(60,60,64,.55);
              padding: 7px 11px; border-radius: 12px; }
  /* Assistant bubbles are FULLY TRANSPARENT in the Portal so the field glows
     through the text — reproduce that, or legibility here is a lie. */
  .msg.bot { align-self: flex-start; color: var(--muted); background: transparent; }
  .msg.bot .lead { color: var(--text); }

  .controls { padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line);
              display: grid; grid-template-columns: auto 1fr auto; gap: 7px 10px; align-items: center; }
  .controls label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .controls input[type=range] { width: 100%; accent-color: var(--accent); }
  .controls output { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .row { display: flex; gap: 8px; align-items: center; grid-column: 1 / -1; }
  button {
    font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 7px;
  }
  button:hover { color: var(--text); border-color: rgba(255,255,255,.28); }
  button[aria-pressed="true"] { color: var(--accent); border-color: rgba(255,74,74,.5); }
  .fps { margin-left: auto; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .err { padding: 10px 12px; color: var(--accent); font-family: ui-monospace, monospace; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>FX <em>Lab</em></h1>
  <span class="meta">device pixel ratio <b id="dprOut">—</b></span>
  <span class="meta"><b id="countOut">—</b> effects registered</span>
  <span class="meta">every effect drawn behind a real transcript — judge legibility, not prettiness</span>
</header>

<div class="grid" id="grid"></div>
<div class="err" id="err" hidden></div>

<script type="module">
import {
    effectList, loadEffect, createEnv,
    applyClearPolicy, applyBlend, resetBlend,
} from './modules/fx/registry.js';
import { ensureSprites } from './modules/fx/sprites.js';
import { backingStore } from './modules/fx/sizing.js';
import './modules/fx/effects/index.js';

const grid = document.getElementById('grid');
const errBox = document.getElementById('err');

// A transcript with a mix of long prose, a short line and code — the three
// things that actually get hard to read over a busy backdrop.
const TRANSCRIPT = [
    ['bot', 'The snapshot ledger is append-only, so every turn you take is recoverable — including the ones you would rather forget.'],
    ['user', 'what did we decide about the reranker?'],
    ['bot', 'Cohere by default, hardware-tiered, body-only. The local cross-encoder stays behind a flag until the GPU box is the primary.'],
];

function buildTranscript(el) {
    for (const [who, text] of TRANSCRIPT) {
        const d = document.createElement('div');
        d.className = 'msg ' + (who === 'user' ? 'user' : 'bot');
        d.textContent = text;
        el.appendChild(d);
    }
}

// One independent driver per card. This is deliberately a *reimplementation* of
// the engine's frame loop in miniature: if an effect needs something the
// descriptor does not expose, it will fail here, which is the point.
function mountCard(meta) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <span class="name"></span><span class="id"></span>
        <span class="badge"></span>
      </div>
      <div class="stage"><canvas></canvas><div class="transcript"></div></div>
      <div class="controls">
        <label>Density</label><input type="range" min="0.2" max="2.5" step="0.05" value="1"><output>1.00</output>
        <label>Speed</label><input type="range" min="0.1" max="3" step="0.05" value="1"><output>1.00</output>
        <div class="row">
          <button data-act="play" aria-pressed="true">Pause</button>
          <button data-act="reseed">Reseed</button>
          <span class="fps">—</span>
        </div>
      </div>`;
    card.querySelector('.name').textContent = meta.label;
    card.querySelector('.id').textContent = meta.id;
    buildTranscript(card.querySelector('.transcript'));
    grid.appendChild(card);

    const canvas = card.querySelector('canvas');
    const badge = card.querySelector('.badge');
    const fpsEl = card.querySelector('.fps');
    const [densEl, speedEl] = card.querySelectorAll('input[type=range]');
    const [densOut, speedOut] = card.querySelectorAll('output');
    const playBtn = card.querySelector('[data-act=play]');
    const reseedBtn = card.querySelector('[data-act=reseed]');

    const ctx = canvas.getContext('2d');
    let descriptor = null, env = null, raf = 0, last = 0, playing = true;
    let frames = 0, fpsT = 0;

    function sizeCanvas() {
        const r = canvas.getBoundingClientRect();
        if (!r.width || !r.height) return false;
        const s = backingStore(r.width, r.height, window.devicePixelRatio);
        canvas.width = s.w; canvas.height = s.h;
        canvas.style.width = r.width + 'px';
        canvas.style.height = r.height + 'px';
        ctx.setTransform(s.dpr, 0, 0, s.dpr, 0, 0);
        if (env) { env.width = r.width; env.height = r.height; env.dpr = s.dpr; }
        return true;
    }

    // Seeded PRNG (mulberry32) so "Reseed" is reproducible and two cards of the
    // same effect are not accidentally identical.
    function makeRand(seed) {
        let a = seed >>> 0;
        return () => {
            a = (a + 0x6D2B79F5) >>> 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    // The engine's own viewport-area density law. A lab card is far smaller than
    // the chat pane, so passing a raw 1.0 would spawn a full-screen population
    // into a thumbnail — which is what made Embers look like soup on first run.
    function areaScale() {
        const a = (env.width * env.height) / (1440 * 900);
        return Math.max(0.4, Math.min(2.4, a));
    }

    // Run the sim forward WITHOUT drawing so the card opens on the effect's
    // steady state. Several effects (Matrix, snow, rain) legitimately start
    // off-canvas and take seconds to fall into view; a gallery that shows their
    // empty entrance is showing the wrong thing.
    const WARMUP_FRAMES = 180;
    function warmUp() {
        for (let i = 0; i < WARMUP_FRAMES; i++) {
            env.now += 1000 / 60;
            env.dt = 1 / 60;
            env.scale = areaScale() * Number(densEl.value);
            descriptor.update(env.dt, env);
        }
    }

    function seed(n) {
        env = createEnv({ rand: makeRand(n), sprites: ensureSprites(), active: true });
        env.now = 1000;                       // non-zero: some effects gate on elapsed time
        sizeCanvas();
        if (descriptor.resize) descriptor.resize(env);
        descriptor.init(env);
        warmUp();
    }

    function frame(now) {
        raf = requestAnimationFrame(frame);
        if (!playing) { last = now; return; }
        const dt = Math.min((now - last) / 1000, 0.05) * Number(speedEl.value);
        last = now;
        env.now = now; env.dt = dt;
        env.scale = areaScale() * Number(densEl.value);
        applyClearPolicy(ctx, descriptor, env);
        applyBlend(ctx, descriptor);
        descriptor.update(dt, env);
        descriptor.draw(ctx, env);
        resetBlend(ctx);

        frames++;
        if (now - fpsT > 500) {
            fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + ' fps';
            frames = 0; fpsT = now;
        }
    }

    densEl.addEventListener('input', () => { densOut.value = Number(densEl.value).toFixed(2); });
    speedEl.addEventListener('input', () => { speedOut.value = Number(speedEl.value).toFixed(2); });
    playBtn.addEventListener('click', () => {
        playing = !playing;
        playBtn.textContent = playing ? 'Pause' : 'Play';
        playBtn.setAttribute('aria-pressed', String(playing));
    });
    reseedBtn.addEventListener('click', () => seed((Math.random() * 1e9) | 0));
    new ResizeObserver(() => { if (env) { sizeCanvas(); if (descriptor.resize) descriptor.resize(env); } })
        .observe(canvas);

    loadEffect(meta.id).then(d => {
        descriptor = d;
        badge.textContent = d.blend === 'lighter' ? 'additive' : d.blend;
        if (d.blend === 'lighter') badge.classList.add('additive');
        seed(1337);
        raf = requestAnimationFrame(frame);
    }).catch(e => {
        card.querySelector('.stage').innerHTML =
            `<div class="err">${meta.id}: ${String(e && e.message || e)}</div>`;
        console.error('[fx-lab]', meta.id, e);
    });
}

const list = effectList();
document.getElementById('countOut').textContent = list.length;
document.getElementById('dprOut').textContent = (window.devicePixelRatio || 1).toFixed(2);
if (!list.length) {
    errBox.hidden = false;
    errBox.textContent = 'No effects registered — check modules/fx/effects/index.js';
}
for (const meta of list) mountCard(meta);
</script>
</body>
</html>
