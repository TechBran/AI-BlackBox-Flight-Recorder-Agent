[pytest]
# Pytest configuration (T1 / audit I1; collection, markers and the CI gate:
# audit rank 34, O21-python-tests-05/-07/-18).
#
# A bare `pytest` from the repo root is THE gate CI runs
# (.github/workflows/ci.yml): every Python suite below, offline and hermetic.
# The root conftest.py strips this box's credentials, blocks non-loopback
# network and sets BLACKBOX_TESTING=1 so the app's lifespan runs no side-effect
# hook. MCP/ runs in its own lean venv via MCP/run_tests.sh, and the UGV Beast
# package under docs/ugv-beast/ carries its own pytest config.
testpaths =
    Orchestrator/tests
    Orchestrator/toolvault/tests
    Orchestrator/sms/tests
    Orchestrator/asterisk/tests
    Orchestrator/tools
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
# Live and hardware tests are opt-in. Run them by naming the marker (a later -m
# replaces this one) and lifting the isolation, e.g.
#   BLACKBOX_TEST_LIVE=1 pytest -m live_store
addopts = -m "not live_store and not live_service and not probe_live and not ugv"
# pytest-timeout (requirements.dev.txt): no single test may hang the gate. The
# slowest hermetic test runs well under a minute.
timeout = 120
# Custom markers.
markers =
    real_fetchers: opt out of the hermetic patch_hf_fetchers autouse fixture so the test exercises the REAL _fetch_hf_models/_fetch_hf_tree (with only _http_get_json patched).
    probe_live: LIVE WS probe against a provider realtime endpoint (network + paid API calls; run explicitly with `pytest diagnostics/voice_probes -m probe_live` — never in CI/default suite).
    live_store: reads this box's real ledger, snapshot index, vector store or ToolVault embedding cache, and may embed queries through the active provider. Excluded by default; run with BLACKBOX_TEST_LIVE=1 pytest -m live_store on a box that has a ledger.
    live_service: talks to the running Orchestrator (:9091), the MCP server (:9093), a real provider or a device. Excluded by default; run with BLACKBOX_TEST_LIVE=1 pytest -m live_service on a box with the service up.
    ugv: UGV Beast robot sub-project (docs/ugv-beast/setup/ugv_tools_api); some of these need ROS2 or the robot itself. Excluded by default; run with pytest -m ugv tests/supervisor tests/er.
# Filter out known noisy warnings from deps that we don't control.
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:apscheduler.*
